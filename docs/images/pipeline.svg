<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Backstory: 15 agents in four stages. Meta models read, compare and judge; code dates, rules and checks the proof.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A97A6"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C27C0E"/></marker>
    <style>
      .stage{fill:#F3F5F8}
      .h{font-size:15px;font-weight:800;fill:#5F6B76;letter-spacing:1.2px}
      .n{fill:#fff;stroke:#E3E8EE;stroke-width:1.5}
      .m{fill:#E8F1FF;stroke:#0866FF;stroke-width:1.5}
      .c{fill:#fff;stroke:#9AA5B1;stroke-width:1.5;stroke-dasharray:5 4}
      .t{font-size:16px;font-weight:700;fill:#12202B}
      .s{font-size:13px;font-weight:600;fill:#0866FF}
      .g{font-size:13px;font-weight:600;fill:#7A8794}
      .w{fill:#fff;font-size:20px;font-weight:800}
    </style>
  </defs>
  <rect width="1600" height="640" rx="24" fill="#fff"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#12202B">How a check works</text>
  <text x="40" y="80" font-size="15" fill="#5F6B76">Blue: a Meta model reads, compares or judges. Dashed: plain code that dates, rules and checks the proof.</text>

  <!-- Stage 1 -->
  <rect class="stage" x="40" y="110" width="350" height="490" rx="18"/>
  <text class="h" x="62" y="142">1  READ THE POST</text>
  <rect class="c" x="60" y="160" width="310" height="54" rx="12"/><text class="t" x="78" y="184">Post reader</text><text class="g" x="78" y="203">X post: text, date, photo or video</text>
  <rect class="c" x="60" y="224" width="310" height="54" rx="12"/><text class="t" x="78" y="248">Frame grabber</text><text class="g" x="78" y="267">ffmpeg: still frames of a video</text>
  <rect class="m" x="60" y="288" width="310" height="54" rx="12"/><text class="t" x="78" y="312">Speech reader</text><text class="s" x="78" y="331">Muse Voice Transcribe</text>
  <rect class="m" x="60" y="352" width="310" height="54" rx="12"/><text class="t" x="78" y="376">Claim reader</text><text class="s" x="78" y="395">Muse Spark + web search</text>
  <rect class="m" x="60" y="416" width="310" height="54" rx="12"/><text class="t" x="78" y="440">Photo finder</text><text class="s" x="78" y="459">SAM 3.1: photos in a screenshot</text>
  <rect class="m" x="60" y="480" width="310" height="54" rx="12"/><text class="t" x="78" y="504">Scene witness</text><text class="s" x="78" y="523">Muse Spark watches, Muse Wonder checks</text>
  <text class="g" x="60" y="572">Output: the claim (place, date, event)</text>
  <text class="g" x="60" y="590">and the images to search for</text>

  <!-- Stage 2 -->
  <rect class="stage" x="430" y="110" width="350" height="490" rx="18"/>
  <text class="h" x="452" y="142">2  FIND ITS PAST</text>
  <rect class="c" x="450" y="160" width="310" height="54" rx="12"/><text class="t" x="468" y="184">Image search</text><text class="g" x="468" y="203">Google Vision: pages with this image</text>
  <rect class="c" x="450" y="224" width="310" height="54" rx="12"/><text class="t" x="468" y="248">Post clock</text><text class="g" x="468" y="267">posting dates on X, TikTok, YouTube</text>
  <rect class="m" x="450" y="288" width="310" height="54" rx="12"/><text class="t" x="468" y="312">Match checker</text><text class="s" x="468" y="331">Muse Spark: same footage or not?</text>
  <rect class="c" x="450" y="352" width="310" height="54" rx="12"/><text class="t" x="468" y="376">Archivist</text><text class="g" x="468" y="395">Internet Archive: first captures</text>
  <rect class="m" x="450" y="416" width="310" height="54" rx="12"/><text class="t" x="468" y="440">Page reader</text><text class="s" x="468" y="459">Muse Spark: how each page describes it</text>
  <text class="g" x="450" y="572">Output: an evidence table, every copy</text>
  <text class="g" x="450" y="590">with its dates and description</text>

  <!-- Stage 3 -->
  <rect class="stage" x="820" y="110" width="350" height="490" rx="18"/>
  <text class="h" x="842" y="142">3  DECIDE</text>
  <rect class="c" x="840" y="160" width="310" height="54" rx="12"/><text class="t" x="858" y="184">Date rule</text><text class="g" x="858" y="203">a copy archived before the claim</text>
  <rect class="m" x="840" y="250" width="310" height="54" rx="12"/><text class="t" x="858" y="274">Judge</text><text class="s" x="858" y="293">Muse Spark: verdict, must cite rows</text>
  <rect class="m" x="840" y="360" width="310" height="54" rx="12"/><text class="t" x="858" y="384">Critic</text><text class="s" x="858" y="403">Muse Wonder: checks every citation</text>
  <line x1="995" y1="214" x2="995" y2="246" stroke="#8A97A6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="995" y1="304" x2="995" y2="356" stroke="#8A97A6" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1150 387 C1210 387 1210 277 1154 277" fill="none" stroke="#C27C0E" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="1008" y="336" font-size="13" font-weight="700" fill="#C27C0E">the critic can send the judge back once</text>
  <text class="g" x="840" y="456">Judge and critic disagree twice:</text>
  <text class="g" x="840" y="474">the answer is "Cannot verify"</text>

  <!-- Stage 4 -->
  <rect class="stage" x="1210" y="110" width="350" height="490" rx="18"/>
  <text class="h" x="1232" y="142">4  CHECK THE PROOF</text>
  <rect class="c" x="1230" y="160" width="310" height="108" rx="12"/><text class="t" x="1248" y="186">Proof check</text>
  <text class="g" x="1248" y="208">"Does not fit" stands only on a copy</text>
  <text class="g" x="1248" y="226">dated &gt; 7 days before the claim, two</text>
  <text class="g" x="1248" y="244">independent sites, or a sign in the scene</text>
  <rect x="1230" y="300" width="310" height="58" rx="14" fill="#C8261B"/><text class="w" x="1252" y="336">Does not fit</text>
  <rect x="1230" y="370" width="310" height="58" rx="14" fill="#187A36"/><text class="w" x="1252" y="406">Fits</text>
  <rect x="1230" y="440" width="310" height="58" rx="14" fill="#925C00"/><text class="w" x="1252" y="476">Cannot verify</text>
  <text class="g" x="1230" y="540">The models propose;</text>
  <text class="g" x="1230" y="558">the code decides what counts as proof.</text>

  <line x1="392" y1="355" x2="426" y2="355" stroke="#8A97A6" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="782" y1="355" x2="816" y2="355" stroke="#8A97A6" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1172" y1="355" x2="1206" y2="355" stroke="#8A97A6" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
